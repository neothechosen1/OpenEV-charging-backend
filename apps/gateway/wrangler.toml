name = "openev-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "CHARGER"
class_name = "ChargerDO"

# SQLite-backed Durable Objects — required for the Workers FREE plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChargerDO"]

[vars]
# Your Convex deployment's HTTP endpoint (the .convex.site URL).
CONVEX_HTTP_URL = "https://YOUR-DEPLOYMENT.convex.site"
# GATEWAY_SHARED_SECRET is a secret:
#   local dev  -> put it in .dev.vars (gitignored)
#   production -> `wrangler secret put GATEWAY_SHARED_SECRET`
